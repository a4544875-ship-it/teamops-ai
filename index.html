*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:var(--panel)}textarea{min-height:88px;resize:vertical}label{font-size:13px;font-weight:650;display:block;margin:10px 0 5px}.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--panel);padding:24px 15px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px}.brand{font-weight:850;font-size:23px;margin:3px 10px 25px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:6px;font-weight:500}.nav{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:12px;text-align:left;font-weight:650}.nav.active,.nav:hover{background:var(--accent-bg);color:var(--text)}.sidefoot{margin-top:auto;color:var(--muted);font-size:11px;padding:12px}.content{padding:26px clamp(15px,3vw,46px);max-width:1550px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:25px}.top h1{margin:0;font-size:27px}.muted{color:var(--muted)}.small{font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);background:var(--panel);font-weight:650}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.soft{background:var(--accent-bg);border-color:transparent}.btn.danger{color:var(--danger)}.panel{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:17px;padding:20px;margin-bottom:15px}.panel h2{margin:0 0 13px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.stat strong{font-size:28px;display:block;margin:5px 0}.stat span{font-size:13px;color:var(--muted)}.stack{display:flex;flex-direction:column;gap:9px}.item{display:flex;align-items:flex-start;gap:13px;padding:12px;border:1px solid var(--line);border-radius:12px}.item .body{flex:1;min-width:0}.item .title{font-weight:700}.item .desc{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}.pill{display:inline-block;border-radius:100px;background:var(--accent-bg);padding:4px 10px;font-size:11px;font-weight:700}.pill.warm{background:var(--warm)}.pill.red{background:#fce5e6;color:#933c47}.spaced{display:flex;gap:9px;justify-content:space-between;align-items:center}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.row input,.row select{width:auto;max-width:100%}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.formgrid .wide{grid-column:1/-1}.empty{text-align:center;color:var(--muted);padding:30px}.calendar{width:100%;border-collapse:collapse;table-layout:fixed}.calendar td,.calendar th{border:1px solid var(--line);padding:8px;vertical-align:top;font-size:12px}.calendar th{color:var(--muted);font-weight:600}.calendar td{height:105px}.daynum{font-weight:800;margin-bottom:7px}.event{font-size:11px;padding:4px 6px;border-radius:7px;margin-bottom:4px;background:var(--accent-bg);overflow-wrap:anywhere}.event[data-person=Carlos]{border-left:3px solid #4f9ecd}.event[data-person=Ted]{border-left:3px solid #b98bc9}.event[data-person=Duan]{border-left:3px solid #dcaa4d}.event[data-person=Beck]{border-left:3px solid #6ebd84}.event[data-person=Danny]{border-left:3px solid #e08a77}.modal{position:fixed;inset:0;background:#142332a8;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.dialog{width:min(690px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:18px;padding:24px}.dialog h2{margin:0}.hidden{display:none!important}.tagrow{display:flex;gap:6px;flex-wrap:wrap}.help{font-size:12px;color:var(--muted);margin:7px 0}.quick{display:flex;gap:8px;align-items:stretch}.quick textarea{min-height:72px}.quick button{white-space:nowrap}.footer{padding:12px 0;color:var(--muted);font-size:12px}button.link{padding:0;border:0;background:none;color:var(--accent);font-weight:650}.notice{padding:12px 15px;background:var(--accent-bg);border-radius:12px;margin-bottom:15px}.check{width:17px;height:17px;accent-color:var(--accent)}.filter{min-width:130px}.scroll{overflow:auto}.week{min-width:740px}.week td{height:125px}.personline{display:flex;gap:8px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}@media(max-width:900px){.shell{display:block}.sidebar{padding:10px;position:sticky;top:0;z-index:5;display:flex;flex-direction:row;overflow:auto;border-bottom:1px solid var(--line);border-right:0;gap:3px}.brand,.sidefoot{display:none}.nav{white-space:nowrap;padding:10px;font-size:12px}.content{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:23px}}@media(max-width:560px){.grid.two,.formgrid{grid-template-columns:1fr}.quick{flex-direction:column}.panel{padding:14px}.calendar td{padding:4px}.calendar td{height:95px}.event{font-size:10px;padding:3px}.row input,.row select{max-width:100%}.dialog{padding:16px}}
</style></head><body><div class="shell"><aside class="sidebar" id="nav"></aside><main class="content"><div class="top"><div><h1 id="heading"></h1><div class="muted small" id="subtitle"></div></div><div class="toolbar"><select id="theme" aria-label="介面主題" onchange="setTheme(this.value)"><option value="cream">☀️ 奶油白</option><option value="pink">🌸 柔粉色</option><option value="dark">🌙 深色</option></select><button class="btn primary" onclick="openQuick()">＋ 隨手記一下</button></div></div><div id="view"></div><div class="footer">TeamOps AI · 本機瀏覽器資料，不會跨裝置同步 · 請定期匯出 JSON 備份 · 網站網址可能被其他人開啟，請勿在共用裝置輸入公司機密</div></main></div><div class="modal hidden" id="modal" role="dialog" aria-modal="true" onclick="if(event.target===this)closeModal()"><div class="dialog"><div class="spaced"><h2 id="modalTitle"></h2><button class="btn" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><input type="file" id="importFile" accept=".json,application/json" hidden onchange="importBackup(event)"><input type="file" id="icsFile" accept=".ics,text/calendar" hidden onchange="importICS(event)"><script>
'use strict';const KEY='teamops_offline_v1';const PEOPLE=['Carlos','Ted','Duan','Beck','Danny'];const STATUS=['潛在需求','待確認','已安排','進行中','等待回覆','已完成','暫停'];const COLORS=['#4f9ecd','#b98bc9','#dcaa4d','#6ebd84','#e08a77'];const today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'});const stamp=()=>new Date().toISOString();const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateText=s=>s?new Date(s+'T00:00:00').toLocaleDateString('zh-TW',{month:'numeric',day:'numeric',weekday:'short'}):'未設定';let page='home',dateCursor=today(),calMode='week',search='',showCompleted=false;
const fresh=()=>({version:1,theme:'cream',members:PEOPLE.map((name,i)=>({id:name,name,skills:[],color:COLORS[i]})),projects:[],clients:[],notes:[],tasks:[],events:[],reminders:[],settings:{start:'09:00',end:'18:00',workingDays:[1,2,3,4,5]},createdAt:stamp()});let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}if(!db||!Array.isArray(db.members)||!Array.isArray(db.projects))db=fresh();for(const k of ['clients','notes','tasks','events','reminders'])if(!Array.isArray(db[k]))db[k]=[];if(!db.settings)db.settings=fresh().settings;/* Keep intentionally deleted members deleted after reload. */function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('儲存失敗，請先匯出備份或清理瀏覽器空間。'+e.message)}}function setTheme(t){db.theme=t;document.documentElement.dataset.theme=t==='cream'?'':t;document.getElementById('theme').value=t;save()}function nav(p){page=p;render()}function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}function v(id){return document.getElementById(id)?.value||''}function checked(id){return document.getElementById(id)?.checked||false}function field(id,label,value='',type='text',extra=''){return `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(id,label,items,value=''){return `<div><label for="${id}">${label}</label><select id="${id}">${items.map(t=>`<option value="${esc(t)}" ${t===value?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`}function textArea(id,label,value=''){return `<div class="wide"><label for="${id}">${label}</label><textarea id="${id}">${esc(value)}</textarea></div>`}function personOptions(value=''){return `<option value="">未指定</option>`+db.members.map(p=>`<option value="${esc(p.name)}" ${value===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}function short(s,n=110){return esc(String(s??'').slice(0,n))}function getProject(id){return db.projects.find(x=>x.id===id)}function projectTitle(id){return getProject(id)?.title||'未關聯'}function projectOptions(value=''){return `<option value="">無關聯</option>`+db.projects.map(p=>`<option value="${esc(p.id)}" ${value===p.id?'selected':''}>${esc(p.title)}</option>`).join('')};
function render(){setTheme(db.theme||'cream');const tabs=[['home','🏡','我的首頁'],['projects','📒','案件記事'],['clients','🏢','客戶資料'],['tasks','✅','我的追蹤'],['people','👥','人員安排'],['insights','✨','智慧提醒'],['settings','⚙️','設定與備份']];document.getElementById('nav').innerHTML=`<div class="brand">🌷 TeamOps AI<small>Carlos 的貼心主管小幫手</small></div>`+tabs.map(([id,icon,label])=>`<button class="nav ${page===id?'active':''}" onclick="nav('${id}')">${icon} ${label}</button>`).join('')+'<div id="cloudBadge" class="sidefoot">☁️ 正在檢查雲端狀態…</div>';const meta={home:['早安，Carlos ☀️','今天也幫你把事情整理得井井有條'],projects:['案件記事本','業務需求、施工案件、快速筆記都在這裡'],clients:['客戶資料','維護客戶名稱與備註，案件仍可直接填入新客戶'],tasks:['我的追蹤清單','提醒只給自己看，不會通知其他人'],people:['人員與安排建議','專長由你設定；空檔僅依已記錄行程計算'],insights:['智慧提醒','本機規則分析，不會呼叫線上 AI'],settings:['設定與資料備份','離線使用，請定期下載 JSON 備份']};document.getElementById('heading').textContent=meta[page][0];document.getElementById('subtitle').textContent=meta[page][1];document.getElementById('view').innerHTML=({home:homeView,projects:projectsView,clients:clientsView,tasks:tasksView,people:peopleView,insights:insightsView,settings:settingsView}[page])()}
const openTasks=()=>db.tasks.filter(t=>!t.done);const activeProjects=()=>db.projects.filter(p=>p.status!=='已完成'&&p.status!=='暫停');const overdue=()=>openTasks().filter(t=>t.due&&t.due<today());const upcoming=()=>openTasks().filter(t=>!t.due||t.due<=plusDays(today(),7));function plusDays(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv-SE')};function eventsOn(d,person=''){return db.events.filter(e=>e.date===d&&(!person||e.person===person)).sort((a,b)=>(a.start||'').localeCompare(b.start||''))};function noteItem(n){return `<div class="item"><div class="body"><div class="title">${short(n.text,150)}</div><div class="desc">${esc(n.createdAt?.slice(0,10)||'')} ${n.projectId?' · '+esc(projectTitle(n.projectId)):''}</div></div><button class="btn" onclick="editNote('${n.id}')">編輯</button></div>`};function taskItem(t){return `<div class="item"><input aria-label="標記完成" class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><div class="body"><div class="title" style="${t.done?'text-decoration:line-through;opacity:.6':''}">${esc(t.title)}</div><div class="desc">${t.due?`提醒 ${esc(t.due)} · `:''}${t.person?esc(t.person)+' · ':''}${t.projectId?esc(projectTitle(t.projectId))+' · ':''}${esc(t.details||'')}</div></div><button class="btn" onclick="editTask('${t.id}')">編輯</button></div>`};function projectItem(p){return `<div class="item"><div class="body"><div class="spaced"><div class="title">${esc(p.title)}</div><span class="pill ${p.status==='待確認'?'warm':''}">${esc(p.status)}</span></div><div class="desc">${esc(p.client||'未填客戶')} · ${esc(p.owner||'未指派')} ${p.due?' · 預計 '+esc(p.due):''}</div><div class="desc">${short(p.description,160)}</div></div><button class="btn" onclick="projectDetail('${p.id}')">詳情</button></div>`};function homeView(){return `<div class="notice">🌷 TeamOps AI 2.0 開發版專注管理組員、案件與主管待辦。月底 Google Calendar 彙整報表將另行設計，平時不需要同步日曆。</div><div class="grid" style="margin-bottom:16px"><div class="panel stat"><span>未完成追蹤</span><strong>${openTasks().length}</strong></div><div class="panel stat"><span>進行中案件</span><strong>${activeProjects().length}</strong></div><div class="panel stat"><span>逾期待辦</span><strong>${overdue().length}</strong></div><div class="panel stat"><span>團隊成員</span><strong>${db.members.length}</strong></div></div><div class="grid two"><div class="panel"><div class="spaced"><h2>📝 最近案件</h2><button class="link" onclick="openProject()">＋ 新增案件</button></div><div class="stack">${db.projects.length?db.projects.slice().reverse().slice(0,5).map(projectItem).join(''):'<div class="empty">還沒有案件，先記下業務告訴你的事吧 🌱</div>'}</div></div><div class="panel"><div class="spaced"><h2>🔔 我需要追蹤</h2><button class="link" onclick="editTask()">＋ 新增待辦</button></div><div class="stack">${openTasks().length?openTasks().slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,6).map(taskItem).join(''):'<div class="empty">沒有未完成的待辦 ✨</div>'}</div></div><div class="panel"><h2>👥 組員工作概況</h2><div class="stack">${db.members.map(m=>`<div class="item"><div class="body"><div class="title">${esc(m.name)}</div><div class="desc">負責案件 ${db.projects.filter(p=>p.owner===m.name).length} 筆 · 主管待追蹤 ${db.tasks.filter(t=>!t.done&&t.person===m.name).length} 筆</div></div></div>`).join('')||'<div class="empty">尚未新增組員</div>'}</div></div><div class="panel"><div class="spaced"><h2>💡 小幫手提醒</h2><button class="link" onclick="nav('insights')">查看全部</button></div><div class="stack">${insights().slice(0,5).map(x=>`<div class="item"><div class="body"><div class="title">${esc(x.title)}</div><div class="desc">${esc(x.detail)}</div></div></div>`).join('')||'<div class="empty">暫時沒有需要提醒的事 🌸</div>'}</div></div></div><div class="panel"><h2>✍️ 最近的隨手筆記</h2><div class="stack">${db.notes.length?db.notes.slice().reverse().slice(0,4).map(noteItem).join(''):'<div class="empty">先記一件事情吧。</div>'}</div></div>`}
function openQuick(){modal('✍️ 隨手記一下',`<p class="help">想到什麼就寫下來。離線版可幫你預填草稿並建立案件或待辦，儲存前都可以修改。</p><label>今天想記下什麼？</label><textarea id="quickText" placeholder="例如：業務說立端下週可能需要 FortiGate HA 建置，記得確認日期"></textarea><div class="row" style="margin-top:12px"><button class="btn primary" onclick="quickSave('note')">儲存筆記</button><button class="btn soft" onclick="quickSave('project')">整理成案件</button><button class="btn" onclick="quickSave('task')">轉成待辦</button></div>`)}function quickSave(kind){const text=v('quickText').trim();if(!text)return alert('請先輸入內容');if(kind==='note'){db.notes.push({id:uid(),text,createdAt:stamp(),projectId:''});save();closeModal();render()}else if(kind==='project'){closeModal();openProject(null,{title:text.slice(0,55),description:text})}else{closeModal();editTask(null,{title:text.slice(0,70),details:text})}}
function clientsView(){const names=[...new Set([...db.clients.map(c=>c.name),...db.projects.map(p=>p.client).filter(Boolean)])].sort();return `<div class="panel"><div class="row"><button class="btn primary" onclick="editClient()">＋ 新增客戶</button><span class="help">案件輸入過的客戶也會顯示在這裡</span></div></div><div class="grid two">${names.map(name=>{const c=db.clients.find(x=>x.name===name);const count=db.projects.filter(x=>x.client===name).length;return `<div class="panel"><div class="spaced"><h2>🏢 ${esc(name)}</h2><div class="row"><button class="btn" onclick="editClientByName(${JSON.stringify(name).replace(/"/g,'&quot;')})">編輯</button><button class="btn danger" onclick="deleteClientByName(${JSON.stringify(name).replace(/"/g,'&quot;')})">刪除</button></div></div><p class="muted small">關聯案件 ${count} 筆</p><p>${esc(c?.note||'尚無備註')}</p></div>`}).join('')||'<div class="panel empty">尚無客戶資料</div>'}</div>`}
function editClientByName(name){editClient(name)}
function editClient(name=''){const c=db.clients.find(x=>x.name===name);modal(name?'編輯客戶':'新增客戶',`${field('cName','客戶名稱 *',name)}${textArea('cNote','客戶備註',c?.note||'')}<button class="btn primary" onclick="saveClient(${JSON.stringify(name).replace(/"/g,'&quot;')})">儲存</button>`)}
function saveClient(oldName=''){const name=v('cName').trim(),note=v('cNote');if(!name)return alert('請輸入客戶名稱');if(name!==oldName&&db.clients.some(x=>x.name===name))return alert('客戶名稱已存在');let c=db.clients.find(x=>x.name===oldName);if(c){c.name=name;c.note=note}else db.clients.push({id:uid(),name,note});if(oldName&&oldName!==name)for(const p of db.projects)if(p.client===oldName)p.client=name;save();closeModal();render()}
function deleteClientByName(name){const count=db.projects.filter(x=>x.client===name).length;if(!confirm(`刪除客戶 ${name} 的資料卡？\n${count} 筆案件中的客戶名稱將保留，不會刪除案件。若仍有案件，此客戶仍會顯示在清單中。`))return;db.clients=db.clients.filter(x=>x.name!==name);save();render()}
function projectsView(){let a=db.projects.filter(p=>!search||[p.title,p.client,p.description,p.owner].some(t=>String(t||'').toLowerCase().includes(search.toLowerCase())));return `<div class="panel"><div class="row"><button class="btn primary" onclick="openProject()">＋ 新增案件</button><button class="btn" onclick="openQuick()">✍️ 快速記事</button><input aria-label="搜尋案件" placeholder="搜尋客戶、案件、工程師" value="${esc(search)}" oninput="search=this.value;document.getElementById('projectList').innerHTML=filteredProjects()"></div></div><div class="grid two"><div class="panel"><h2>📂 案件清單 · ${db.projects.length}</h2><div id="projectList" class="stack">${a.length?a.slice().reverse().map(projectItem).join(''):'<div class="empty">找不到相關案件</div>'}</div></div><div class="panel"><h2>📓 快速筆記 · ${db.notes.length}</h2><div class="stack">${db.notes.length?db.notes.slice().reverse().map(noteItem).join(''):'<div class="empty">尚未建立筆記</div>'}</div></div></div>`}function filteredProjects(){const a=db.projects.filter(p=>!search||[p.title,p.client,p.description,p.owner].some(t=>String(t||'').toLowerCase().includes(search.toLowerCase())));return a.length?a.slice().reverse().map(projectItem).join(''):'<div class="empty">找不到相關案件</div>'}function openProject(id=null,pref={}){const p=id?getProject(id):null;modal(p?'編輯案件':'新增案件',`<div class="formgrid">${field('pTitle','案件名稱 *',p?.title||pref.title||'')}${field('pClient','客戶名稱',p?.client||'')}${selectField('pStatus','目前狀態',STATUS,p?.status||'潛在需求')}<div><label>負責人</label><select id="pOwner">${personOptions(p?.owner)}</select></div>${field('pDue','預計日期',p?.due||'','date')}${field('pSource','來源（業務／口頭／LINE 等）',p?.source||'口頭')}${textArea('pDesc','案件內容／需要確認',p?.description||pref.description||'')}</div><div class="row" style="margin-top:16px"><button class="btn primary" onclick="saveProject(${JSON.stringify(id)})">儲存案件</button>${p?`<button class="btn danger" onclick="deleteRecord('projects','${id}')">刪除案件</button>`:''}</div>`)}function saveProject(id){const title=v('pTitle').trim();if(!title)return alert('請輸入案件名稱');const old=id?getProject(id):null;const p={...(old||{id:uid(),logs:[],createdAt:stamp()}),title,client:v('pClient'),status:v('pStatus'),owner:v('pOwner'),due:v('pDue'),source:v('pSource'),description:v('pDesc'),updatedAt:stamp()};if(old)Object.assign(old,p);else db.projects.push(p);save();closeModal();render()}function projectDetail(id){const p=getProject(id);if(!p)return;const logs=(p.logs||[]).slice().reverse();modal(p.title,`<div class="spaced"><span class="pill">${esc(p.status)}</span><button class="btn" onclick="openProject('${id}')">編輯案件</button></div><p>${esc(p.client||'未填客戶')} · ${esc(p.owner||'未指派')} · ${p.due?esc(p.due):'未設定日期'}</p><p style="white-space:pre-wrap">${esc(p.description||'未填內容')}</p><hr style="border:0;border-top:1px solid var(--line)"><h3>歷史進度記錄</h3><div class="stack">${logs.map(l=>`<div class="item"><div class="body"><div class="desc">${esc(l.at.slice(0,16).replace('T',' '))}</div><div>${esc(l.text)}</div></div><button class="btn" onclick="editLog('${id}',${(p.logs||[]).indexOf(l)})">編輯</button><button class="btn danger" onclick="removeLog('${id}',${(p.logs||[]).indexOf(l)})">刪除</button></div>`).join('')||'<p class="muted">尚無更新紀錄</p>'}</div><label>新增處理紀錄</label><textarea id="logText" placeholder="例如：已與業務確認施工時間，待客戶回覆"></textarea><div class="row" style="margin-top:10px"><button class="btn primary" onclick="addLog('${id}')">記錄進度</button><button class="btn" onclick="taskForProject('${id}')">建立待辦</button></div>`)}function taskForProject(id){const p=getProject(id);closeModal();editTask(null,{title:'追蹤：'+(p?.title||'案件'),projectId:id})}function addLog(id){const t=v('logText').trim();if(!t)return alert('請填寫記錄');const p=getProject(id);(p.logs||(p.logs=[])).push({at:stamp(),text:t});p.updatedAt=stamp();save();projectDetail(id)}function editLog(projectId,index){const p=getProject(projectId),l=p?.logs?.[index];if(!l)return;modal('編輯進度記錄',`${textArea('editLogText','進度內容',l.text)}<button class="btn primary" onclick="saveLogEdit('${projectId}',${index})">儲存修改</button>`)}
function saveLogEdit(projectId,index){const p=getProject(projectId),l=p?.logs?.[index];if(!l)return;const value=v('editLogText').trim();if(!value)return alert('請填寫內容');l.text=value;l.updatedAt=stamp();save();projectDetail(projectId)}
function removeLog(projectId,index){const p=getProject(projectId);if(!p?.logs?.[index])return;if(!confirm('刪除這筆進度記錄？此動作無法復原。'))return;p.logs.splice(index,1);save();projectDetail(projectId)}
function editNote(id){const n=db.notes.find(x=>x.id===id);modal(n?'編輯筆記':'新增筆記',`${textArea('noteText','記錄內容',n?.text||'')}<div><label>關聯案件（可選）</label><select id="noteProject">${projectOptions(n?.projectId)}</select></div><div class="row" style="margin-top:15px"><button class="btn primary" onclick="saveNote(${JSON.stringify(id)})">儲存</button>${n?`<button class="btn danger" onclick="deleteRecord('notes','${id}')">刪除</button>`:''}</div>`)}function saveNote(id){const text=v('noteText').trim();if(!text)return alert('請填寫筆記');const n=id?db.notes.find(x=>x.id===id):null;if(n){n.text=text;n.projectId=v('noteProject')}else db.notes.push({id:uid(),text,createdAt:stamp(),projectId:v('noteProject')});save();closeModal();render()}
function tasksView(){const tasks=db.tasks.filter(t=>showCompleted||!t.done).slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return `<div class="panel"><div class="row"><button class="btn primary" onclick="editTask()">＋ 新增待辦</button><label style="margin:0"><input type="checkbox" style="width:auto" ${showCompleted?'checked':''} onchange="showCompleted=this.checked;render()"> 顯示已完成</label></div></div><div class="panel"><h2>✅ 我的追蹤事項 · ${tasks.length}</h2><div class="stack">${tasks.length?tasks.map(taskItem).join(''):'<div class="empty">沒有需要追蹤的待辦 ✨</div>'}</div></div>`}function editTask(id=null,pref={}){const t=db.tasks.find(x=>x.id===id);modal(t?'編輯待辦':'新增追蹤事項',`<div class="formgrid">${field('tTitle','待辦內容 *',t?.title||pref.title||'')}${field('tDue','提醒日期',t?.due||'','date')}<div><label>與哪位成員有關</label><select id="tPerson">${personOptions(t?.person)}</select></div><div><label>關聯案件</label><select id="tProject">${projectOptions(t?.projectId||pref.projectId)}</select></div>${textArea('tDetails','補充說明',t?.details||pref.details||'')}</div><div class="row" style="margin-top:15px"><button class="btn primary" onclick="saveTask(${JSON.stringify(id)})">儲存待辦</button>${t?`<button class="btn danger" onclick="deleteRecord('tasks','${id}')">刪除</button>`:''}</div>`)}function saveTask(id){const title=v('tTitle').trim();if(!title)return alert('請填寫待辦');const t=db.tasks.find(x=>x.id===id);const record={id:t?.id||uid(),title,due:v('tDue'),person:v('tPerson'),projectId:v('tProject'),details:v('tDetails'),done:t?.done||false,createdAt:t?.createdAt||stamp()};if(t)Object.assign(t,record);else db.tasks.push(record);save();closeModal();render()}function toggleTask(id,done){const t=db.tasks.find(x=>x.id===id);if(t){t.done=done;t.doneAt=done?stamp():null;save();render()}}function deleteRecord(type,id){const allowed=['projects','notes','tasks','events'];if(!allowed.includes(type))return;const linked=type==='projects'?db.notes.filter(x=>x.projectId===id).length+db.tasks.filter(x=>x.projectId===id).length:0;const warning=linked?`\n另有 ${linked} 筆相關記事或待辦會保留，並解除案件關聯。`:'';if(!confirm('確定要刪除這筆資料嗎？建議先備份。'+warning))return;if(type==='projects'){for(const n of db.notes)if(n.projectId===id)n.projectId='';for(const t of db.tasks)if(t.projectId===id)t.projectId='';}db[type]=db[type].filter(x=>x.id!==id);save();closeModal();render()}
function eventItem(e){return `<div class="item"><div class="body"><div class="title">${esc(e.person)} · ${esc(e.title)}</div><div class="desc">${esc(e.date)} ${esc(e.start||'全天')} ${e.end?'– '+esc(e.end):''} ${e.type?' · '+esc(e.type):''}</div><div class="desc">${short(e.description,100)}</div></div><button class="btn" onclick="editEvent('${e.id}')">查看</button></div>`}function weekStart(d){const x=new Date(d+'T12:00:00');const w=x.getDay();x.setDate(x.getDate()-((w+6)%7));return x.toLocaleDateString('sv-SE')};function calendarView(){const start=calMode==='week'?weekStart(dateCursor):dateCursor.slice(0,7)+'-01';let dates=[];if(calMode==='week')for(let i=0;i<7;i++)dates.push(plusDays(start,i));else{const first=weekStart(start);for(let i=0;i<42;i++)dates.push(plusDays(first,i))}const visible=calMode==='week'?dates:dates;return `<div class="panel"><div class="row"><button class="btn primary" onclick="editEvent()">＋ 新增行程</button><button class="btn" onclick="document.getElementById('icsFile').click()">匯入 ICS 日曆</button><button class="btn" onclick="changeDate(-1)">◀</button><button class="btn" onclick="dateCursor=today();render()">今天</button><button class="btn" onclick="changeDate(1)">▶</button><strong>${esc(calMode==='week'?`${dates[0]} ～ ${dates[6]}`:start.slice(0,7))}</strong><select onchange="calMode=this.value;render()"><option value="week" ${calMode==='week'?'selected':''}>週檢視</option><option value="month" ${calMode==='month'?'selected':''}>月檢視</option></select></div><p class="help">行程重疊全部顯示；點擊任何行程可查看、編輯。匯入 ICS 時選擇對應成員。</p><div class="tagrow">${db.members.map(m=>`<span class="pill" style="border-left:4px solid ${m.color}">${esc(m.name)}</span>`).join('')}</div></div><div class="panel scroll"><table class="calendar ${calMode==='week'?'week':''}"><thead><tr>${['一','二','三','四','五','六','日'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${Array.from({length:dates.length/7},(_,week)=>`<tr>${dates.slice(week*7,week*7+7).map(d=>`<td style="${calMode==='month'&&!d.startsWith(start.slice(0,7))?'opacity:.45':''}"><div class="daynum">${esc(d.slice(5))}</div>${eventsOn(d).map(e=>`<button class="event" style="border:0;text-align:left;width:100%;cursor:pointer" data-person="${esc(e.person)}" onclick="editEvent('${e.id}')"><b>${esc(e.person)}</b> ${esc(e.start||'全天')} ${short(e.title,45)}</button>`).join('')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function changeDate(n){dateCursor=plusDays(dateCursor,n*(calMode==='week'?7:28));render()}function editEvent(id=null){const e=db.events.find(x=>x.id===id);modal(e?'查看／編輯行程':'新增行程',`<div class="formgrid">${field('eTitle','行程標題 *',e?.title||'')}<div><label>工程師</label><select id="ePerson">${db.members.map(p=>`<option value="${esc(p.name)}" ${e?.person===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>${field('eDate','日期 *',e?.date||dateCursor,'date')}${selectField('eType','行程類型',['施工','會議','LAB / 測試','遠端處理','教育訓練','預留','休假','其他'],e?.type||'其他')}${field('eStart','開始時間',e?.start||'','time')}${field('eEnd','結束時間',e?.end||'','time')}${textArea('eDesc','備註／客戶／處理內容',e?.description||'')}</div><div class="row" style="margin-top:15px"><button class="btn primary" onclick="saveEvent(${JSON.stringify(id)})">儲存行程</button>${e?`<button class="btn danger" onclick="deleteRecord('events','${id}')">刪除</button>`:''}</div>`)}function saveEvent(id){const title=v('eTitle').trim(),date=v('eDate');if(!title||!date)return alert('請輸入標題及日期');const e=db.events.find(x=>x.id===id),r={id:e?.id||uid(),title,date,person:v('ePerson'),start:v('eStart'),end:v('eEnd'),description:v('eDesc'),type:v('eType'),origin:e?.origin||'手動'};if(e)Object.assign(e,r);else db.events.push(r);save();closeModal();render()}
function parseICSDate(v){if(!v)return null;const m=v.match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d))?/);return m?{date:`${m[1]}-${m[2]}-${m[3]}`,time:m[4]?`${m[4]}:${m[5]}`:''}:null}function unfoldICS(s){return s.replace(/\r?\n[ \t]/g,'').replace(/\r/g,'')}function unescapeICS(s){return (s||'').replace(/\\n/gi,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\')}function importICS(ev){const file=ev.target.files?.[0];ev.target.value='';if(!file)return;const names=db.members.map(m=>m.name);const p=prompt('請輸入這份日曆屬於哪位工程師：\n'+names.join(' / '),names[0]||'');if(!p||!names.includes(p))return alert('請輸入現有組員的正確姓名');file.text().then(s=>{const chunks=unfoldICS(s).split('BEGIN:VEVENT').slice(1);let total=0;for(const c of chunks){const body=c.split('END:VEVENT')[0],vals={};for(const line of body.split('\n')){const idx=line.indexOf(':');if(idx<0)continue;const key=line.slice(0,idx).split(';')[0].toUpperCase(),value=line.slice(idx+1).trim();if(['SUMMARY','DESCRIPTION','DTSTART','DTEND','UID','STATUS'].includes(key))vals[key]=value}if(vals.STATUS==='CANCELLED')continue;const d=parseICSDate(vals.DTSTART),end=parseICSDate(vals.DTEND);if(!d)continue;const sourceId=`ics:${p}:${vals.UID||vals.SUMMARY+vals.DTSTART}:${vals.DTSTART}`;if(db.events.some(x=>x.sourceId===sourceId))continue;db.events.push({id:uid(),sourceId,origin:'ICS',title:unescapeICS(vals.SUMMARY)||'(無標題)',description:unescapeICS(vals.DESCRIPTION),person:p,date:d.date,start:d.time,end:end?.time||'',type:'其他'});total++}save();render();alert(`匯入 ${total} 筆新行程。注意：ICS 可能含時區資訊，請核對跨時區事件的時間。`)}).catch(e=>alert('無法讀取 ICS：'+e.message))}
function peopleView(){return `<div class="panel"><div class="row"><button class="btn primary" onclick="editMember()">＋ 新增組員</button><span class="muted small">可編輯姓名與專長，並查看每位組員相關案件和主管追蹤</span></div></div><div class="grid two">${db.members.map(m=>{const assigned=db.projects.filter(p=>p.owner===m.name);const followups=db.tasks.filter(t=>!t.done&&t.person===m.name);return `<div class="panel"><div class="spaced"><h2>👤 ${esc(m.name)}</h2><button class="btn" onclick="editMember('${m.name}')">編輯</button><button class="btn danger" onclick="removeMember('${m.name}')">刪除</button></div><p class="muted small">專長：${m.skills?.length?m.skills.map(esc).join('、'):'尚未設定'}</p><p class="muted small">負責案件：${assigned.length} 筆 · 待追蹤：${followups.length} 筆</p><div class="stack">${assigned.slice(0,4).map(p=>`<div class="event">${esc(p.title)} · ${esc(p.status||'待確認')}</div>`).join('')||'<div class="muted small">目前沒有負責案件</div>'}</div></div>`}).join('')}</div>`}function editMember(name=''){const m=db.members.find(x=>x.name===name);modal(m?'編輯組員':'新增組員',`${field('mName','姓名 *',m?.name||'')}${field('mSkills','專長（逗號分隔）',(m?.skills||[]).join(', '))}${field('mColor','代表色',m?.color||'#8dc6bf','color')}<p class="help">更改姓名後，相關案件、待辦與行程的負責人名稱也會更新。Google 日曆同步設定需另外重新對應。</p><button class="btn primary" onclick="saveMember('${esc(name)}')">儲存組員</button>`)}
function saveMember(oldName=''){const name=v('mName').trim();if(!name)return alert('請輸入姓名');if(db.members.some(m=>m.name===name&&m.name!==oldName))return alert('已有同名組員');const skills=v('mSkills').split(/[,，、]/).map(x=>x.trim()).filter(Boolean);const color=v('mColor')||'#8dc6bf';const old=db.members.find(m=>m.name===oldName);if(old){old.name=name;old.skills=skills;old.color=color;if(name!==oldName){for(const p of db.projects)if(p.owner===oldName)p.owner=name;for(const t of db.tasks)if(t.person===oldName)t.person=name;for(const e of db.events)if(e.person===oldName)e.person=name;}}else db.members.push({id:uid(),name,skills,color});save();closeModal();render()}
function removeMember(name){const m=db.members.find(x=>x.name===name);if(!m)return;const projects=db.projects.filter(x=>x.owner===name).length,tasks=db.tasks.filter(x=>x.person===name).length,events=db.events.filter(x=>x.person===name).length;if(!confirm(`刪除組員 ${name}？\n關聯案件 ${projects} 筆、待辦 ${tasks} 筆、行程 ${events} 筆將保留，但改為未指定人員。\n建議先匯出 JSON 備份。`))return;db.members=db.members.filter(x=>x.id!==m.id);for(const p of db.projects)if(p.owner===name)p.owner='';for(const t of db.tasks)if(t.person===name)t.person='';for(const e of db.events)if(e.person===name)e.person='';save();render()}
function findPeople(){const date=v('fDate'),duration=v('fDuration'),skill=v('fSkill').trim().toLowerCase();const f=e=>{if(!e.start||!e.end)return true;const a=duration==='上午'?'09:00':duration==='下午'?'13:00':'09:00',b=duration==='上午'?'12:00':duration==='下午'?'18:00':'18:00';return e.start<b&&e.end>a};let matches=db.members.map(m=>{const events=eventsOn(date,m.name).filter(f);const skills=m.skills||[];const skillMatch=!skill||skills.some(s=>s.toLowerCase().includes(skill));return {m,events,skillMatch}}).sort((a,b)=>Number(b.skillMatch)-Number(a.skillMatch)||a.events.length-b.events.length);document.getElementById('peopleResult').innerHTML=`<div class="stack" style="margin-top:15px">${matches.map(x=>`<div class="item"><div class="body"><div class="title">${esc(x.m.name)} · ${x.skillMatch?'✅ 專長符合／未指定':'⚪ 專長未標記符合'}</div><div class="desc">${x.events.length?`${x.events.length} 筆相關時段行程：`+x.events.map(e=>esc(e.title)).join('、'):'查無該時段已記錄行程（待確認）'}</div></div></div>`).join('')}</div>`}
function insights(){const a=[];for(const t of overdue())a.push({title:`待辦逾期：${t.title}`,detail:`原提醒日 ${t.due}，尚未標記完成`});for(const p of db.projects.filter(p=>p.due&&p.due<today()&&!['已完成','暫停'].includes(p.status)))a.push({title:`案件預計日期已過：${p.title}`,detail:`預計 ${p.due}，目前狀態 ${p.status}`});for(const e of db.events.filter(e=>e.date>=plusDays(today(),-7)&&e.date<=plusDays(today(),14))){if(/^(上課|測試|客戶|會議|LAB)$/i.test(e.title.trim())&&!e.description?.trim())a.push({title:`${e.person} 的行程可補充資訊：${e.title}`,detail:`${e.date} · 建議確認詳細工作內容`});if(/預留|暫定/.test(e.title)&&e.date<=today())a.push({title:`預留行程待確認：${e.person} · ${e.title}`,detail:`${e.date} · 可詢問結果是否已確定`})}return a}function insightsView(){const a=insights();return `<div class="notice">🪄 以下是「本機規則提醒」，不是真正的 AI 推論。全部只顯示給 Carlos，不會自動發送通知。</div><div class="panel"><h2>提醒建議 · ${a.length}</h2><div class="stack">${a.length?a.map(x=>`<div class="item"><div class="body"><div class="title">${esc(x.title)}</div><div class="desc">${esc(x.detail)}</div></div><button class="btn" onclick="createTaskFromInsight('${encodeURIComponent(x.title)}','${encodeURIComponent(x.detail)}')">加入待辦</button></div>`).join(''):'<div class="empty">目前沒有規則提醒；匯入日曆或新增案件後會自動分析。</div>'}</div></div>`}function createTaskFromInsight(title,detail){editTask(null,{title:decodeURIComponent(title),details:decodeURIComponent(detail)})}
function settingsView(){return `<div class="grid two"><div class="panel"><h2>🎨 外觀</h2><p class="muted small">首頁右上角可隨時切換奶油白、柔粉色、深色。</p><h2>📊 月底日曆彙整（規劃中）</h2><p class="help">日常不需要同步 Google Calendar。日後需要月底彙整時才手動同步指定月份並匯出報表。</p></div><div class="panel"><h2>🔐 備份與還原</h2><p class="muted small">所有資料僅存在此瀏覽器。清除網站資料、無痕模式或更換電腦可能遺失，請定期備份。</p><div class="row"><button class="btn primary" onclick="exportBackup()">⬇ 匯出 JSON 備份</button><button class="btn" onclick="document.getElementById('importFile').click()">⬆ 匯入備份</button></div><p class="help">匯入會取代目前資料，請先匯出備份。</p></div><div class="panel"><h2>🧪 試用資料</h2><p class="muted small">可以加入虛構的案件、行程和待辦，測試畫面與操作。</p><button class="btn" onclick="addDemo()">加入示範資料</button><p class="help">示範資料均有「示範」文字，非真實公司案件。</p></div><div class="panel"><h2>🧹 清空離線資料</h2><p class="muted small">重置案件、筆記、待辦、行程和成員專長，不影響 Google 日曆。</p><button class="btn danger" onclick="resetAll()">清除所有本機資料</button></div></div>`}function exportBackup(){const blob=new Blob([JSON.stringify({...db,exportedAt:stamp()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TeamOps_AI_backup_'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importBackup(event){const f=event.target.files?.[0];event.target.value='';if(!f)return;if(!confirm('匯入會取代目前所有資料。確定嗎？'))return;f.text().then(s=>{const x=JSON.parse(s);if(!x||!Array.isArray(x.projects)||!Array.isArray(x.events)||!Array.isArray(x.members)||!Array.isArray(x.tasks)||!Array.isArray(x.notes))throw Error('檔案不是 TeamOps AI 備份');db=x;save();render();alert('資料已還原')}).catch(e=>alert('匯入失敗：'+e.message))}function resetAll(){if(prompt('清除後無法復原。請輸入 RESET 確認：')!=='RESET')return;db=fresh();save();render()}function addDemo(){if(db.projects.some(x=>x.demo))return alert('示範資料已加入過');const pid=uid();db.projects.push({id:pid,title:'【示範】客戶網路設備汰換',client:'示範客戶 A',status:'待確認',owner:'Ted',due:plusDays(today(),5),source:'示範業務口頭需求',description:'【示範】確認設備型號與施工日期',demo:true,logs:[],createdAt:stamp()});db.notes.push({id:uid(),text:'【示範】業務提到可能有一筆 Wi-Fi 專案，下週再追蹤',createdAt:stamp(),projectId:'',demo:true});db.tasks.push({id:uid(),title:'【示範】向業務確認施工日期',due:plusDays(today(),2),person:'Ted',projectId:pid,details:'示範提醒',done:false,demo:true});db.events.push({id:uid(),title:'【示範】客戶設備測試',person:'Danny',date:plusDays(today(),1),start:'10:00',end:'12:00',description:'示範事件',type:'LAB / 測試',demo:true});save();render();alert('已加入示範資料')};render();
</script><script src="./cloud.js"></script><script>if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) { window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{})); }</script></body></html>
